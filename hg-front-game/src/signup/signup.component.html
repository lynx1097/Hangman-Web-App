<div class="signup-form">
  <h2>Signup</h2>
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" aria-labelledby="signup-form-title">
    <div class="form-group">
      <label for="name">Name:</label>
      <input 
        id="name" 
        formControlName="name" 
        type="text" 
        required 
        aria-required="true" 
        placeholder="Enter your name" 
        class="form-control" 
      />
      <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched" class="error">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input 
        id="email" 
        formControlName="email" 
        type="email" 
        required 
        aria-required="true" 
        placeholder="Enter your email" 
        class="form-control" 
      />
      <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="error">
        A valid email is required.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input 
        id="password" 
        formControlName="password" 
        type="password" 
        required 
        aria-required="true" 
        placeholder="Enter your password" 
        class="form-control" 
      />
      <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="error">
        Password is required.
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password:</label>
      <input 
        id="confirmPassword" 
        formControlName="confirmPassword" 
        type="password" 
        required 
        aria-required="true" 
        placeholder="Re-enter your password" 
        class="form-control" 
      />
      <div *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched" class="error">
        Please confirm your password.
      </div>
    </div>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>
    <button 
      type="submit" 
      [disabled]="signupForm.invalid" 
      [attr.aria-disabled]="signupForm.invalid ? 'true' : 'false'" 
      class="btn btn-primary">
      Sign Up
    </button>
  </form>
</div>
